name: CI e Staging
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceub-cd-lab
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Ceub.Delivery.slnx
      - name: Build
        run: dotnet build Ceub.Delivery.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Ceub.Delivery.slnx -c Release --no-build --logger trx
      - name: Publish
        run: dotnet publish src/Ceub.Api/Ceub.Api.csproj -c Release --no-build -o publish
      - name: Empacotar a imagem uma unica vez
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          IMAGE="ceub-api:${GITHUB_SHA}"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          docker build --build-arg APP_VERSION="$VERSION" --build-arg APP_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
          docker save "$IMAGE" -o bundle/api-image.tar
          cp scripts/deploy.sh bundle/deploy.sh
          printf '%s\n' "$IMAGE" > bundle/image.txt
          docker image inspect --format '{{.Id}}' "$IMAGE" > bundle/image-id.txt
          printf 'commit=%s\nversion=%s\nrun_id=%s\n' "$GITHUB_SHA" "$VERSION" "$GITHUB_RUN_ID" > bundle/manifest.txt
          cd bundle
          sha256sum api-image.tar deploy.sh image.txt image-id.txt manifest.txt > SHA256SUMS
      - name: Armazenar pacote de entrega
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: bundle/
          retention-days: 7
          overwrite: true
          compression-level: 0
          if-no-files-found: error

  staging:
    needs: build
    runs-on: [self-hosted, Linux, X64, ceub-cd]
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Baixar o pacote desta execucao
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/ceub-staging-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Conferir e implantar em staging
        shell: bash
        working-directory: ${{ runner.temp }}/ceub-staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          grep -Fx "commit=$GITHUB_SHA" manifest.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" manifest.txt
          docker load -i api-image.tar
          IMAGE="$(cat image.txt)"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(cat image-id.txt)"
          bash deploy.sh staging "$IMAGE" false false
          cat manifest.txt
          curl --fail http://127.0.0.1:8081/
