name: Promover para Producao
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID numerico da execucao CI e Staging aprovada'
        required: true
        type: string
      falha_controlada:
        description: 'Forcar HTTP 503 para testar rollback'
        required: true
        default: false
        type: boolean
      novidade:
        description: 'Ativar feature flag'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ceub-cd-lab
  cancel-in-progress: false

jobs:
  validar-origem:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.origem.outputs.sha }}
    steps:
      - name: Validar que a execucao veio de staging com sucesso
        id: origem
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Run ID invalido'; exit 1; }
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq -e '.conclusion == "success" and .head_branch == "main" and (.path | split("@")[0]) == ".github/workflows/ci-staging.yml" and (.event == "push" or .event == "workflow_dispatch")' run.json
          SHA="$(jq -r '.head_sha' run.json)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  production:
    needs: validar-origem
    runs-on: [self-hosted, Linux, X64, ceub-cd]
    timeout-minutes: 10
    environment: production
    steps:
      - name: Baixar o MESMO pacote aprovado
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validar-origem.outputs.sha }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ceub-prod-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Conferir, implantar e validar
        shell: bash
        working-directory: ${{ runner.temp }}/ceub-prod-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          FAIL_HEALTH: ${{ inputs.falha_controlada }}
          FEATURE: ${{ inputs.novidade }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ needs.validar-origem.outputs.sha }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          grep -Fx "commit=$EXPECTED_SHA" manifest.txt
          grep -Fx "run_id=$SOURCE_RUN_ID" manifest.txt
          docker load -i api-image.tar
          IMAGE="$(cat image.txt)"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(cat image-id.txt)"
          bash deploy.sh production "$IMAGE" "$FAIL_HEALTH" "$FEATURE"
          cat manifest.txt
          curl --fail http://127.0.0.1:8082/
